[project]
name = "omniassist"
version = "0.1.0"
description = "A production-grade multimodal AI assistant built on tool orchestration."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "celery>=5.6.3",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "fastembed>=0.9.0",
    "fpdf2>=2.9.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.15.1",
    "pypdf>=6.19.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.1",
    "streamlit>=1.64.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "types-openpyxl>=3.1.5.20261017",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.mypy]
plugins = ["pydantic.mypy"]
