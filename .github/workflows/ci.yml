name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Format check
        run: uv run ruff format --check app/ tests/ ui/

      - name: Lint
        run: uv run ruff check app/ tests/ ui/

      - name: Type check
        run: uv run mypy app/ tests/ ui/